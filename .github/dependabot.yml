    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
        # vite 同时出现在 client 与 root 两个 manifest，组更新重写 lock 时
        # 会漏掉 vite/fsevents 条目，npm ci 直接挂（#22/#27 两次实证）；
        # 单包 PR 从未坏过，让 vite 单独走
        exclude-patterns:
          - "vite"