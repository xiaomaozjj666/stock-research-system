# Dependabot：定期扫描 npm 依赖的安全更新与版本升级。
# 与 `npm audit`（点查）互补——Dependabot 会主动提 PR 修复已知漏洞依赖。
# npm 生态在 monorepo workspaces 下只需在根目录声明一个 ecosystem。
#
# 约束：同一个包不要同时出现在 devDependencies/dependencies 与 package.json 的 overrides 里。
# Dependabot 会**分别**更新这两处，只要有一侧先动、两侧 specifier 不再逐字相同，npm 就报
# EOVERRIDE 并拒绝解析，表现为本任务每周报一次 dependency_file_not_resolvable 而整体变红
# （2026-09-22 的 nanoid 即如此，已移除其 override，见 docs/ENGINEERING-NOTES.md）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 10
    # 分组提 PR，减少噪音；安全更新不受分组限制、单独提
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
        # 组更新重写跨工作区 lock 时会漏 vite/fsevents 条目，npm ci 直接挂
        # （#22/#27 两次实证，与 overrides 无关的 dependabot 缺陷），让 vite 单独走。
        # 单包 PR 曾因孤儿 overrides.vite 而 EOVERRIDE 失败（#30）——该 override
        # 已于 2026-10-14 移除，此后单包 PR 验证健康（rebase 后全绿）
        exclude-patterns:
          - 'vite'
    # TS7 与部分依赖 peer 冲突，升级需人工验证；ignore 由 CI 门禁兜底
    labels:
      - dependencies

  # GitHub Actions 自身版本也纳入维护
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
